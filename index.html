<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A live analog clock rendered with the HTML5 Canvas API." />
  <link rel="stylesheet" href="style.css" />
  <title>Analog Clock</title>
</head>
<body>
  <main class="stage">
    <canvas
      id="clock"
      role="img"
      aria-label="Analog clock showing the current time"
    ></canvas>
  </main>

  <noscript>
    <p class="noscript-msg">This clock needs JavaScript enabled to run.</p>
  </noscript>

  <script src="init.js" defer></script>
</body>
</html>
